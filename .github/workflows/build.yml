name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install Linux libraries for Tauri
        run: |
          sudo apt-get update -o Acquire::Retries=3
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - name: Type check and frontend tests
        run: |
          npx tsc --noEmit
          npx vitest run
      - name: Build frontend
        run: npx vite build
      - name: Rust tests
        working-directory: src-tauri
        run: cargo test

  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - name: Build installer
        run: npx tauri build
      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: StudyNotes-windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
      # main に新しい版番号が入ったら、タグ v<版番号> を付けて Releases に公開する
      - name: Decide release
        id: rel
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          tag="v${version}"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          if gh release view "${tag}" --repo "${{ github.repository }}" > /dev/null 2>&1; then
            echo "Release ${tag} already exists"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            test -f "docs/releases/${tag}.md" || { echo "::error::docs/releases/${tag}.md がありません（リリースの変更点を書いてください）"; exit 1; }
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish release
        if: steps.rel.outputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.rel.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: StudyNotes ${{ steps.rel.outputs.tag }}
          body_path: docs/releases/${{ steps.rel.outputs.tag }}.md
          make_latest: true
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
