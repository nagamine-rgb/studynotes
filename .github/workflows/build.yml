name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install Linux libraries for Tauri
        run: |
          sudo apt-get update -o Acquire::Retries=3
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - name: Type check and frontend tests
        run: |
          npx tsc --noEmit
          npx vitest run
      - name: Build frontend
        run: npx vite build
      - name: Rust tests
        working-directory: src-tauri
        run: cargo test

  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    outputs:
      tag: ${{ steps.rel.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - name: Build installer
        run: npx tauri build
      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: StudyNotes-windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
      # main に新しい版番号が入ったら、タグ v<版番号> を付けて Releases に公開する
      - name: Decide release
        id: rel
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          tag="v${version}"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          if gh release view "${tag}" --repo "${{ github.repository }}" > /dev/null 2>&1; then
            echo "Release ${tag} already exists"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            test -f "docs/releases/${tag}.md" || { echo "::error::docs/releases/${tag}.md がありません（リリースの変更点を書いてください）"; exit 1; }
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish release
        if: steps.rel.outputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.rel.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: StudyNotes ${{ steps.rel.outputs.tag }}
          body_path: docs/releases/${{ steps.rel.outputs.tag }}.md
          make_latest: true
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi

  # Android 版（APK）。署名の鍵は GitHub の Secrets に登録しておく：
  #   ANDROID_KEY_BASE64 … keystore ファイルを base64 にしたもの
  #   ANDROID_KEY_PASSWORD … keystore と鍵のパスワード
  android:
    needs: windows
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: android
      - run: npm ci
      - name: Find Android NDK
        run: |
          ndk="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          if [ -z "$ndk" ]; then ndk=$(ls -d "$ANDROID_HOME"/ndk/* | sort -V | tail -1); fi
          echo "NDK: $ndk"
          echo "NDK_HOME=$ndk" >> "$GITHUB_ENV"
      - name: Generate Android project
        run: npx tauri android init --ci
      - name: Signing key
        id: key
        env:
          KEY_B64: ${{ secrets.ANDROID_KEY_BASE64 }}
          KEY_PW: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEY_B64" ] && [ -n "$KEY_PW" ]; then
            echo "$KEY_B64" | base64 -d > "$RUNNER_TEMP/studynotes.jks"
            printf 'storeFile=%s\nkeyAlias=studynotes\npassword=%s\n' "$RUNNER_TEMP/studynotes.jks" "$KEY_PW" > src-tauri/gen/android/keystore.properties
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::署名の鍵（ANDROID_KEY_BASE64 / ANDROID_KEY_PASSWORD）が未登録のため、インストールできない未署名の APK になります"
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Configure Android project (permissions, signing)
        run: node scripts/android-setup.mjs
      - name: Build APK
        run: npx tauri android build --apk --target aarch64 armv7
      - name: Collect APK
        id: apk
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          src=$(ls src-tauri/gen/android/app/build/outputs/apk/universal/release/*.apk | head -1)
          suffix=$([ "${{ steps.key.outputs.signed }}" = "true" ] && echo "" || echo "_unsigned")
          out="StudyNotes_${version}_android${suffix}.apk"
          cp "$src" "$out"
          ls -la "$out"
          echo "file=$out" >> "$GITHUB_OUTPUT"
          echo "tag=v${version}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: StudyNotes-android
          path: ${{ steps.apk.outputs.file }}
      # この版のリリースがあり、まだ APK が付いていなければ添付する（鍵の登録後の再実行でも付く）
      - name: Attach APK to release
        if: steps.key.outputs.signed == 'true' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ steps.apk.outputs.tag }}"
          if ! gh release view "$tag" --repo "${{ github.repository }}" > /dev/null 2>&1; then
            echo "Release $tag がまだないので添付しません"; exit 0
          fi
          if gh release view "$tag" --repo "${{ github.repository }}" --json assets --jq '.assets[].name' | grep -q '_android\.apk$'; then
            echo "Release $tag にはすでに APK があります"; exit 0
          fi
          gh release upload "$tag" "${{ steps.apk.outputs.file }}" --repo "${{ github.repository }}"
